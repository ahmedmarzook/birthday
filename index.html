<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شاشة الورد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#2B1130;
    --plum-deep:#1B0A20;
    --gold:#E8B84B;
    --pink:#E85D8A;
    --teal:#2FA6A0;
    --cream:#FBF3E7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse at top, #3A1740 0%, var(--plum) 45%, var(--plum-deep) 100%);
    color:var(--cream);
    font-family:'Cairo',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  /* soft twinkling lights across the sky (optional, matches the birthday page style) */
  .lights{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .light{
    position:absolute;width:6px;height:6px;border-radius:50%;
    background:var(--gold);opacity:.55;
    animation:twinkle 2.6s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8);}50%{opacity:.9;transform:scale(1.3);}}

  /* ---------- HERO / ROSE SCREEN ---------- */
  .hero{
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    position:relative;
    padding:40px 20px;
    overflow:hidden;
  }

  /* field of roses scattered across the whole opening screen */
  .roses-field{
    position:absolute;inset:0;
    overflow:hidden;pointer-events:none;z-index:0;
  }
  .rose-deco{
    position:absolute;opacity:0;
    filter:drop-shadow(0 6px 12px rgba(0,0,0,.4));
    animation:roseBloom 1s ease forwards, roseSway 5.5s ease-in-out infinite;
  }
  .rose-deco svg{display:block;width:100%;height:100%;}
  @keyframes roseBloom{
    0%{opacity:0;transform:scale(.35) rotate(-14deg);}
    100%{opacity:.95;transform:scale(1) rotate(0deg);}
  }
  @keyframes roseSway{
    0%,100%{translate:0 0;}
    50%{translate:0 -10px;}
  }

  .sparkle{
    position:absolute;pointer-events:none;z-index:1;
    color:var(--gold);font-size:18px;
    animation:sparklePulse 1.8s ease-in-out infinite;
  }
  @keyframes sparklePulse{
    0%,100%{opacity:.2;transform:scale(.6) rotate(0deg);}
    50%{opacity:1;transform:scale(1.15) rotate(20deg);}
  }

  /* ---------- BIG CENTER ROSE (the click target) ---------- */
  .big-rose{
    position:relative;z-index:2;
    cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:20px;
    background:none;border:none;color:inherit;font-family:inherit;
  }
  .rose-stage{
    position:relative;
    width:min(56vw,240px);height:min(56vw,240px);
  }
  /* soft blurred contact shadow under the flower, for a grounded, 3D feel */
  .rose-stage::after{
    content:"";
    position:absolute;left:50%;bottom:-6%;
    width:62%;height:16%;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 72%);
    transform:translateX(-50%);
    filter:blur(2px);
    z-index:-1;
  }
  .big-rose .rose-wrap{
    width:100%;height:100%;
    filter:drop-shadow(0 16px 30px rgba(0,0,0,.45));
    transition:transform .35s ease;
    animation:invitePulse 2.4s ease-in-out infinite;
  }
  .big-rose .rose-wrap svg{width:100%;height:100%;display:block;}
  .big-rose:hover .rose-wrap{transform:translateY(-6px) scale(1.05);animation-play-state:paused;}
  @keyframes invitePulse{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-8px) rotate(-2deg);}
  }
  .gift-hint{
    font-size:15px;letter-spacing:.02em;color:var(--cream);opacity:.75;
    position:relative;z-index:2;
  }
  .gift-hint b{color:var(--gold);font-weight:700;}

  /* ---------- TEXT REVEALED AFTER CLICK ---------- */
  .reveal-title{
    font-family:'Lalezar',sans-serif;
    font-size:clamp(30px,7vw,52px);
    line-height:1.25;
    color:var(--gold);
    margin:0 0 6px;
    opacity:0;transform:translateY(14px) scale(.96);
    transition:opacity .6s ease, transform .6s ease;
  }
  .reveal-sub{
    font-size:clamp(15px,3vw,19px);
    color:var(--cream);opacity:0;transform:translateY(10px);
    transition:opacity .6s ease .15s, transform .6s ease .15s;
    max-width:480px;
  }
  .hero.revealed .big-rose,
  .hero.revealed .roses-field,
  .hero.revealed .gift-hint{display:none;}
  .hero.revealed .reveal-title,
  .hero.revealed .reveal-sub{opacity:1;transform:translateY(0) scale(1);}

  /* ---------- CONFETTI (plays once on click) ---------- */
  .confetti-piece{
    position:fixed;top:-10px;z-index:5;pointer-events:none;
    border-radius:2px;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{transform:translateY(110vh) rotate(540deg);opacity:.9;}
  }
</style>
</head>
<body>

<div class="lights" id="lights"></div>

<!-- ================= HERO: this whole block is what you add to your project ================= -->
<div class="hero" id="hero">

  <div class="roses-field" id="rosesField"></div>

  <div class="sparkle" style="top:6%;left:20%;">✦</div>
  <div class="sparkle" style="top:14%;right:16%;animation-delay:.5s;">✧</div>
  <div class="sparkle" style="top:2%;left:48%;animation-delay:1s;">✦</div>
  <div class="sparkle" style="top:22%;right:38%;animation-delay:1.4s;">✧</div>

  <button class="big-rose" id="bigRose" aria-label="دوسي على الوردة">
    <span class="rose-stage">
      <span class="rose-wrap" id="mainRoseSlot"></span>
    </span>

    <div class="reveal-title" id="revealTitle">كل سنة وانتي طيبة يا حبيبتي، يا أجمل حاجة حصلتلي ❤️</div>
    <div class="reveal-sub" id="revealSub">دوسي على الوردة وشوفي المفاجأة</div>
  </button>

  <div class="gift-hint">دوسي على <b>الوردة</b> وشوفي المفاجأة</div>

</div>
<!-- ================= END HERO ================= -->

<script>
  // twinkling background lights (optional decoration, remove if your project already has one)
  const lightsEl = document.getElementById('lights');
  for(let i=0;i<40;i++){
    const l = document.createElement('div');
    l.className='light';
    l.style.left = Math.random()*100+'vw';
    l.style.top = Math.random()*100+'vh';
    l.style.animationDelay = (Math.random()*2.6)+'s';
    lightsEl.appendChild(l);
  }

  /* -----------------------------------------------------------
     A realistic layered rose, built entirely from SVG paths:
     - 8 large outer petals (scalloped, heart-shaped top, each
       rotated/scaled with slight random jitter so no two roses
       look mechanically identical)
     - 6 medium petals layered on top, tighter and darker
     - 6 small tightly-wound petals forming the spiral centre
     - radial gradients placed near each petal's tip so the tip
       reads as a highlight and the base (toward the flower's
       centre) reads as natural shadow
     - two soft "shine" streaks on front-facing petals + a tiny
       catch-light at the very centre, like light hitting dew
     - a curved stem with two veined leaves
     {ID} is replaced with a unique string per rose so many
     roses can share the same markup without gradient-id clashes.
  ----------------------------------------------------------- */
  const roseSVG = `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pOuter{ID}" cx="50%" cy="16%" r="92%">
      <stop offset="0%" stop-color="#fff1f4"/>
      <stop offset="28%" stop-color="#ffb2c6"/>
      <stop offset="62%" stop-color="#e2557b"/>
      <stop offset="100%" stop-color="#8f1f42"/>
    </radialGradient>
    <radialGradient id="pMid{ID}" cx="50%" cy="14%" r="90%">
      <stop offset="0%" stop-color="#ffd8e1"/>
      <stop offset="35%" stop-color="#e56c8d"/>
      <stop offset="70%" stop-color="#b23459"/>
      <stop offset="100%" stop-color="#6e1631"/>
    </radialGradient>
    <radialGradient id="pInner{ID}" cx="50%" cy="18%" r="90%">
      <stop offset="0%" stop-color="#e0567c"/>
      <stop offset="55%" stop-color="#a52a4d"/>
      <stop offset="100%" stop-color="#4c1128"/>
    </radialGradient>
    <linearGradient id="stemGrad{ID}" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#5fd1b3"/>
      <stop offset="100%" stop-color="#1c6f5f"/>
    </linearGradient>
    <linearGradient id="leafGrad{ID}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57c8a9"/>
      <stop offset="100%" stop-color="#1f7a63"/>
    </linearGradient>
  </defs>

  <!-- stem, gently curved -->
  <path d="M100 124 C 92 150 108 168 98 198" stroke="url(#stemGrad{ID})" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- leaves, with a centre vein -->
  <g>
    <path d="M95 148c-22-8-38 2-42 24 22 8 38-2 42-24z" fill="url(#leafGrad{ID})"/>
    <path d="M78 152c8 4 14 10 17 18" stroke="#125446" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".6"/>
    <path d="M108 160c19-9 34-1 39 18-19 9-34 1-39-18z" fill="url(#leafGrad{ID})"/>
    <path d="M124 163c-6 5-10 11-12 19" stroke="#125446" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".6"/>
  </g>

  <g transform="translate(100 92)">

    <!-- outer ring: 8 large scalloped petals, each nudged a little
         so the bloom doesn't look perfectly mechanical -->
    <g fill="url(#pOuter{ID})">
      <path transform="rotate(4)   scale(1.05)" d="M0,-70 C13,-70 24,-59 22,-46 C31,-48 37,-38 33,-25 C30,-13 18,-3 0,3 C-18,-3 -30,-13 -33,-25 C-37,-38 -31,-48 -22,-46 C-24,-59 -13,-70 0,-70 Z"/>
      <path transform="rotate(50)  scale(.96)"  d="M0,-70 C13,-70 24,-59 22,-46 C31,-48 37,-38 33,-25 C30,-13 18,-3 0,3 C-18,-3 -30,-13 -33,-25 C-37,-38 -31,-48 -22,-46 C-24,-59 -13,-70 0,-70 Z"/>
      <path transform="rotate(93)  scale(1.08)" d="M0,-70 C13,-70 24,-59 22,-46 C31,-48 37,-38 33,-25 C30,-13 18,-3 0,3 C-18,-3 -30,-13 -33,-25 C-37,-38 -31,-48 -22,-46 C-24,-59 -13,-70 0,-70 Z"/>
      <path transform="rotate(139) scale(.94)"  d="M0,-70 C13,-70 24,-59 22,-46 C31,-48 37,-38 33,-25 C30,-13 18,-3 0,3 C-18,-3 -30,-13 -33,-25 C-37,-38 -31,-48 -22,-46 C-24,-59 -13,-70 0,-70 Z"/>
      <path transform="rotate(183) scale(1.02)" d="M0,-70 C13,-70 24,-59 22,-46 C31,-48 37,-38 33,-25 C30,-13 18,-3 0,3 C-18,-3 -30,-13 -33,-25 C-37,-38 -31,-48 -22,-46 C-24,-59 -13,-70 0,-70 Z"/>
      <path transform="rotate(228) scale(1.1)"  d="M0,-70 C13,-70 24,-59 22,-46 C31,-48 37,-38 33,-25 C30,-13 18,-3 0,3 C-18,-3 -30,-13 -33,-25 C-37,-38 -31,-48 -22,-46 C-24,-59 -13,-70 0,-70 Z"/>
      <path transform="rotate(273) scale(.92)"  d="M0,-70 C13,-70 24,-59 22,-46 C31,-48 37,-38 33,-25 C30,-13 18,-3 0,3 C-18,-3 -30,-13 -33,-25 C-37,-38 -31,-48 -22,-46 C-24,-59 -13,-70 0,-70 Z"/>
      <path transform="rotate(318) scale(1.04)" d="M0,-70 C13,-70 24,-59 22,-46 C31,-48 37,-38 33,-25 C30,-13 18,-3 0,3 C-18,-3 -30,-13 -33,-25 C-37,-38 -31,-48 -22,-46 C-24,-59 -13,-70 0,-70 Z"/>
    </g>

    <!-- middle ring: 6 tighter, more cupped petals -->
    <g fill="url(#pMid{ID})">
      <path transform="rotate(18)  scale(.62)" d="M0,-68 C12,-68 21,-58 19,-46 C27,-46 32,-36 27,-24 C23,-14 12,-6 0,-2 C-12,-6 -23,-14 -27,-24 C-32,-36 -27,-46 -19,-46 C-21,-58 -12,-68 0,-68 Z"/>
      <path transform="rotate(78)  scale(.58)" d="M0,-68 C12,-68 21,-58 19,-46 C27,-46 32,-36 27,-24 C23,-14 12,-6 0,-2 C-12,-6 -23,-14 -27,-24 C-32,-36 -27,-46 -19,-46 C-21,-58 -12,-68 0,-68 Z"/>
      <path transform="rotate(138) scale(.65)" d="M0,-68 C12,-68 21,-58 19,-46 C27,-46 32,-36 27,-24 C23,-14 12,-6 0,-2 C-12,-6 -23,-14 -27,-24 C-32,-36 -27,-46 -19,-46 C-21,-58 -12,-68 0,-68 Z"/>
      <path transform="rotate(198) scale(.6)"  d="M0,-68 C12,-68 21,-58 19,-46 C27,-46 32,-36 27,-24 C23,-14 12,-6 0,-2 C-12,-6 -23,-14 -27,-24 C-32,-36 -27,-46 -19,-46 C-21,-58 -12,-68 0,-68 Z"/>
      <path transform="rotate(258) scale(.63)" d="M0,-68 C12,-68 21,-58 19,-46 C27,-46 32,-36 27,-24 C23,-14 12,-6 0,-2 C-12,-6 -23,-14 -27,-24 C-32,-36 -27,-46 -19,-46 C-21,-58 -12,-68 0,-68 Z"/>
      <path transform="rotate(318) scale(.57)" d="M0,-68 C12,-68 21,-58 19,-46 C27,-46 32,-36 27,-24 C23,-14 12,-6 0,-2 C-12,-6 -23,-14 -27,-24 C-32,-36 -27,-46 -19,-46 C-21,-58 -12,-68 0,-68 Z"/>
    </g>

    <!-- spiral centre: small tightly-wound petals -->
    <g fill="url(#pInner{ID})">
      <path transform="rotate(10)  scale(.3)" d="M0,-68 C14,-68 24,-56 21,-42 C30,-42 34,-30 27,-18 C21,-8 10,-2 0,0 C-10,-2 -21,-8 -27,-18 C-34,-30 -30,-42 -21,-42 C-24,-56 -14,-68 0,-68 Z"/>
      <path transform="rotate(68)  scale(.28)" d="M0,-68 C14,-68 24,-56 21,-42 C30,-42 34,-30 27,-18 C21,-8 10,-2 0,0 C-10,-2 -21,-8 -27,-18 C-34,-30 -30,-42 -21,-42 C-24,-56 -14,-68 0,-68 Z"/>
      <path transform="rotate(126) scale(.31)" d="M0,-68 C14,-68 24,-56 21,-42 C30,-42 34,-30 27,-18 C21,-8 10,-2 0,0 C-10,-2 -21,-8 -27,-18 C-34,-30 -30,-42 -21,-42 C-24,-56 -14,-68 0,-68 Z"/>
      <path transform="rotate(184) scale(.27)" d="M0,-68 C14,-68 24,-56 21,-42 C30,-42 34,-30 27,-18 C21,-8 10,-2 0,0 C-10,-2 -21,-8 -27,-18 C-34,-30 -30,-42 -21,-42 C-24,-56 -14,-68 0,-68 Z"/>
      <path transform="rotate(242) scale(.29)" d="M0,-68 C14,-68 24,-56 21,-42 C30,-42 34,-30 27,-18 C21,-8 10,-2 0,0 C-10,-2 -21,-8 -27,-18 C-34,-30 -30,-42 -21,-42 C-24,-56 -14,-68 0,-68 Z"/>
      <path transform="rotate(300) scale(.26)" d="M0,-68 C14,-68 24,-56 21,-42 C30,-42 34,-30 27,-18 C21,-8 10,-2 0,0 C-10,-2 -21,-8 -27,-18 C-34,-30 -30,-42 -21,-42 C-24,-56 -14,-68 0,-68 Z"/>
    </g>

    <!-- tiny swirl right at the heart of the bud -->
    <path d="M-2,-9 C7,-9 12,-3 11,4 C10,10 3,13 -3,11" stroke="#3a0e21" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".55"/>

    <!-- soft shine streaks on the front-facing petals, like light catching them -->
    <path transform="rotate(-18)" d="M-2,-60 C2,-46 3,-32 0,-20" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".22"/>
    <path transform="rotate(35)"  d="M-1,-52 C2,-40 2,-28 -1,-18" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".16"/>

    <!-- a tiny catch-light at the very centre -->
    <circle cx="-3" cy="-6" r="2.4" fill="#ffe9ef" opacity=".7"/>
  </g>
</svg>`;

  // place the big rose in the centre
  document.getElementById('mainRoseSlot').innerHTML = roseSVG.split('{ID}').join('main');

  // scatter roses all across the opening screen, each with a unique id
  // so their gradients don't collide with one another
  const rosesEl = document.getElementById('rosesField');
  for(let i=0;i<22;i++){
    const wrap = document.createElement('div');
    wrap.className = 'rose-deco';
    const size = 36 + Math.random()*50;
    wrap.style.width = size+'px';
    wrap.style.height = size+'px';
    wrap.style.left = Math.random()*94+'%';
    wrap.style.top = Math.random()*94+'%';
    wrap.style.animationDelay = (Math.random()*1.2)+'s, '+(Math.random()*3)+'s';
    wrap.style.animationDuration = '1s, '+(4+Math.random()*3)+'s';
    wrap.innerHTML = roseSVG.split('{ID}').join('r'+i);
    rosesEl.appendChild(wrap);
  }

  // confetti burst played once when the rose is clicked
  function burstConfetti(){
    const colors = ['#E8B84B','#E85D8A','#2FA6A0','#FBF3E7'];
    for(let i=0;i<90;i++){
      const p = document.createElement('div');
      p.className='confetti-piece';
      const size = 6+Math.random()*6;
      p.style.width = size+'px';
      p.style.height = (size*0.4)+'px';
      p.style.left = Math.random()*100+'vw';
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      const duration = 2.6+Math.random()*1.8;
      p.style.animationDuration = duration+'s';
      p.style.animationDelay = (Math.random()*0.4)+'s';
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), (duration+0.4)*1000);
    }
  }

  // click on the big rose: quick confetti burst, then go to the birthday page
  const hero = document.getElementById('hero');
  const bigRose = document.getElementById('bigRose');
  bigRose.addEventListener('click', ()=>{
    hero.classList.add('revealed');
    burstConfetti();
    setTimeout(()=>{
      // 👇 غيّري اسم الملف هنا لو سميتي صفحة عيد الميلاد بإسم مختلف
      window.location.href = 'party.html';
    }, 900); // نفس مدة ظهور الكونفيتي قبل ما ننتقل للصفحة
  });
</script>

</body>
</html>
